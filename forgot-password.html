<style>
/* Premium Animation */

body{
background:
radial-gradient(circle at top,#142b66,#031438 60%);
overflow:hidden;
}


body::before{
content:"";
position:fixed;
width:400px;
height:400px;
background:#ffb800;
opacity:.08;
border-radius:50%;
top:-150px;
left:-150px;
animation:moveGlow 8s infinite alternate;
}


@keyframes moveGlow{
from{
transform:translate(0,0);
}
to{
transform:translate(100px,80px);
}
}


.input-box{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
box-shadow:0 8px 25px rgba(0,0,0,.3);
}


.btn-submit{
animation:btnGlow 2s infinite alternate;
}


@keyframes btnGlow{
from{
box-shadow:0 0 5px #ffb800;
}
to{

}
}
