<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - PRIMX-BET</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0b1a40; /* Dark blue background */
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* Header / Navbar */
        .header {
            display: flex;
            align-items: center;
            padding-bottom: 20px;
            position: relative;
        }
        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            cursor: pointer;
        }
        .header h3 {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-right: 20px; /* offset for centering */
        }

        /* PRIMX-BET Logo */
        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0 30px 0;
            gap: 10px;
        }
        .logo-icon {
            background-color: #ffcc00;
            color: #0b1a40;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .logo-text {
            color: #ffcc00;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Form Inputs */
        .input-group {
            background-color: #11224f;
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 15px;
        }
        .input-group i {
            color: #b0c4de;
            margin-right: 15px;
            font-size: 16px;
        }
        .flag-icon {
            width: 20px;
            height: 20px;
            background-color: #006a4e; /* BD Green */
            border-radius: 50%;
            position: relative;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flag-icon::after {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #f42a41; /* BD Red */
            border-radius: 50%;
        }
        .country-code {
            color: #ffffff;
            font-weight: bold;
            margin-right: 15px;
        }
        .input-group input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            width: 100%;
        }
        .input-group input::placeholder {
            color: #7b8fa3;
        }

        /* Terms Checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 12px;
            color: #d1d5db;
        }
        .checkbox-group input {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            accent-color: #0b1a40;
        }

        /* Submit Button */
        .submit-btn {
            background: linear-gradient(to bottom, #ffe066, #ffb300);
            border: none;
            border-radius: 5px;
            color: #000000;
            font-weight: bold;
            font-size: 16px;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 30px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #d1d5db;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #3b4c75;
        }
        .divider span {
            padding: 0 10px;
        }

        /* Google Button */
        .google-btn {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .google-icon {
            width: 50px;
            height: 50px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ea4335;
            cursor: pointer;
        }

        /* Footer Links */
        .footer-text {
            text-align: center;
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 20px;
        }
        .footer-text a {
            color: #ffcc00;
            text-decoration: none;
            font-weight: bold;
        }

        /* Banner */
        .banner {
            background: linear-gradient(to right, #f6d365 0%, #fda085 100%);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .banner-icon {
            background-color: #ff4757;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 10px;
            font-size: 12px;
        }
        .banner-subtext {
            text-align: center;
            font-size: 11px;
            color: #d1d5db;
            line-height: 1.5;
        }

    </style>
</head>
<body>

<div class="container">
    
    <!-- Header Updated with Back Button Link -->
    <div class="header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h3>নিবন্ধন</h3>
    </div>

    <!-- PRIMX-BET Logo -->
    <div class="logo-section">
        <div class="logo-icon">
            <i class="fa-solid fa-crown"></i>
        </div>
        <div class="logo-text">PRIMX-BET</div>
    </div>

    <!-- Form Inputs -->
    <div class="input-group">
        <div class="flag-icon"></div>
        <span class="country-code">+880</span>
        <input type="text" placeholder="মোবাইল নম্বর">
    </div>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="পাসওয়ার্ড">
    </div>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="পাসওয়ার্ড নিশ্চিত করুন">

    <!-- Terms Checkbox -->
    <div class="checkbox-group">
        <input type="checkbox" checked id="terms">
        <label for="terms">আমি পড়েছি এবং terms and privacy policy এ সম্মত হয়েছি</label>
    </div>

    <!-- Submit Button -->
    <button class="submit-btn">নিবন্ধন</button>

    <!-- Divider -->
    <div class="divider">
        <span>অথবা চালিয়ে যান</span>
    </div>

    <!-- Google Login -->
    <div class="google-btn">
        <div class="google-icon">
            <i class="fa-brands fa-google"></i>
        </div>
    </div>

    <!-- Bottom Text Updated with Login Link -->
    <div class="footer-text">
        ইতিমধ্যে একটি অ্যাকাউন্ট আছে? <a href="login.html">এখন প্রবেশ করুন</a>
    </div>

    <!-- 1.1.1.1 Banner -->
    <div class="banner">
        <div class="banner-icon">1⁴</div>
        DOWNLOAD 1.1.1.1
    </div>
    <div class="banner-subtext">
        ডাউনলোড করুন 1.1.1.1, যেকোনো সময় অ্যাক্সেস করুন<br>ব্লক হওয়ার চিন্তা নেই
    </div>

</div>

</body>
</html>
<style>
    /* 1. Background Gradient Animation */
body {
    background: linear-gradient(-45deg, #051026, #0b1a40, #132b63, #08122c);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 2. Floating Effect (Main Box) */
.container {
    animation: floatAnimation 4s ease-in-out infinite;
}

@keyframes floatAnimation {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
}

/* 3. Logo Glow & Pulse Animation */
.logo-icon {
    animation: logoGlow 3s ease-in-out infinite;
}

@keyframes logoGlow {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
    }
    50% {
        transform: scale(1.08);
        box-shadow: 0 0 22px rgba(255, 204, 0, 0.8);
    }
}

/* 4. Input Focus Animation */
.input-group {
    transition: all 0.3s ease;
}

.input-group:focus-within {
    border: 1px solid #ffcc00;
    box-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
    transform: translateY(-2px);
    background-color: #162b61;
}

/* 5. Button Animation (Hover & Click) */
.submit-btn {
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(255, 179, 0, 0.3);
}

.submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(255, 204, 0, 0.6);
}

.submit-btn:active {
    transform: translateY(1px);
}

/* Back Button & Google Icon Animation */
.back-btn {
    transition: transform 0.2s ease;
}

.back-btn:hover {
    transform: translateX(-3px);
    color: #ffcc00;
}

.google-icon {
    transition: all 0.3s ease;
}

.google-icon:hover {
    transform: scale(1.1) rotate(5deg);
}
