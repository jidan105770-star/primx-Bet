<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primxbet Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #031438;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Navigation Header */
    .top-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 18px;
      font-weight: 600;
    }

    .back-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
    }

    /* Logo Styling */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .crown-box {
      width: 40px;
      height: 40px;
      background: linear-gradient(180deg, #f7d050 0%, #d89614 100%);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .logo-text {
      color: #ffb800;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* Form Fields */
    .form-group {
      width: 100%;
      margin-bottom: 15px;
    }

    .input-box {
      width: 100%;
      display: flex;
      align-items: center;
      background-color: #050e26;
      border: 1px solid #14254b;
      border-radius: 6px;
      padding: 12px 14px;
    }

    .phone-prefix {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
    }

    .flag-icon {
      width: 20px;
      height: 14px;
      border-radius: 2px;
      background-color: #006a4e;
      position: relative;
      display: inline-block;
    }

    .flag-icon::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: #f42a41;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .input-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14px;
      margin-left: 10px;
    }

    .input-box input::placeholder {
      color: #6a7b9b;
    }

    .icon-left {
      color: #6a7b9b;
      font-size: 16px;
    }

    .toggle-pass {
      color: #6a7b9b;
      cursor: pointer;
      font-size: 14px;
    }

    /* Row Options */
    .form-options {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin: 8px 0 20px 0;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #d1d5db;
      cursor: pointer;
    }

    .remember-me input {
      accent-color: #2563eb;
    }

    .forgot-link {
      color: #ffb800;
      text-decoration: underline;
      font-weight: 500;
    }

    /* Action Button */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(180deg, #f7d050 0%, #d89614 100%);
      border: none;
      border-radius: 6px;
      color: #000000;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.95;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 30px 0;
      color: #8fa0c0;
      font-size: 14px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #14254b;
    }

    .divider span {
      padding: 0 15px;
    }

    /* Google Button */
    .google-btn {
      width: 52px;
      height: 52px;
      background-color: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* Footer Switch Text */
    .footer-text {
      margin-top: 35px;
      font-size: 14px;
      color: #d1d5db;
      text-align: center;
    }

    .footer-text a {
      color: #ffb800;
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Header -->
    <div class="top-header">
      <a href="index.html" class="back-btn">&#8592;</a>
      <span>লগইন</span>
      <span style="width: 20px;"></span>
    </div>

    <!-- Logo -->
    <div class="logo">
      <div class="crown-box">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#000000">
          <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
        </svg>
      </div>
      <span class="logo-text">PRIMX-BET</span>
    </div>

    <!-- Form -->
    <form style="width: 100%;" onsubmit="event.preventDefault();">
      <!-- Phone Input -->
      <div class="form-group">
        <div class="input-box">
          <div class="phone-prefix">
            <span class="flag-icon"></span>
            <span>+880</span>
          </div>
          <input type="tel" placeholder="ফোন নম্বর" required>
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <div class="input-box">
          <span class="icon-left">🔒</span>
          <input type="password" id="password" placeholder="পাসওয়ার্ড" required>
          <span class="toggle-pass" onclick="togglePasswordVisibility()">👁️</span>
        </div>
      </div>

      <!-- Remember & Forgot Password -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" checked>
          <span>মনে রাখুন</span>
        </label>
        <a href="forgot-password.html" class="forgot-link">
পাসওয়ার্ড ভুলে গেছেন?
        </a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit">লগইন</button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>অথবা চালিয়ে যান</span>
    </div>

    <!-- Social Login -->
    <div class="google-btn" onclick="googleLogin()">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
    </div>

    <!-- Bottom Link -->
    <div class="footer-text">
  এখনও কোনো অ্যাকাউন্ট নেই?
  <a href="register.html">অ্যাকাউন্ট তৈরি করুন</a>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    }
  </script>

</body>
</html>
