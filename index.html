<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primex-Bet</title>
    <!-- Font Awesome & Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bdok-blue: #0b2265;
            --card-border: #f3c242;
            --accent-yellow: #ffc107;
            --bg-dark: #07122b;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 70px;
        }

        /* Top Announcement Bar */
        .notice-bar {
            background: #0f2b5c;
            color: #ffc107;
            padding: 8px 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a3d7c;
        }

        /* Top Banner Slider */
        .banner-slider {
            width: 100%;
            padding: 10px;
        }

        .carousel-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #1a3a75;
        }

        /* Category Nav Icons */
        .cat-nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 8px 10px;
            background: #091a3e;
        }

        .cat-item {
            flex: 0 0 auto;
            width: 65px;
            background: #122853;
            border-radius: 12px;
            padding: 8px 0;
            text-align: center;
            font-size: 11px;
            color: #fff;
            text-decoration: none;
            border: 1px solid #1d3870;
        }

        .cat-item.active {
            background: #ffc107;
            color: #000;
            font-weight: bold;
        }

        .cat-item i {
            font-size: 18px;
            display: block;
            margin-bottom: 4px;
        }

        /* Section Titles */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffc107;
            margin: 15px 10px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 10px;
        }

        .game-card {
            background: #0d234d;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid #1a3a75;
            text-decoration: none;
            color: #fff;
            text-align: center;
        }

        .game-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }

        .game-title {
            font-size: 12px;
            padding: 6px 2px;
            background: rgba(0,0,0,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
        }

        /* Floating Social Icons */
        .floating-socials {
            position: fixed;
            right: 10px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 999;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            text-decoration: none;
        }

        .btn-cs { background: #0088cc; }
        .btn-tg { background: #24a1de; }
        .btn-fb { background: #1877f2; }
        .btn-wa { background: #25d366; }

        /* Bottom Fixed Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #091838;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid #1a366b;
            z-index: 1000;
        }

        .nav-link-custom {
            color: #8fa0c4;
            text-align: center;
            font-size: 11px;
            text-decoration: none;
        }

        .nav-link-custom.active {
            color: #ffc107;
        }

        .nav-link-custom i {
            font-size: 18px;
            display: block;
        }

        .agent-btn {
            background: #ffc107;
            color: #000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -25px;
            border: 3px solid #07122b;
            box-shadow: 0 0 10px rgba(255,193,7,0.5);
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Notice Bar -->
    <div class="notice-bar">
        <span><i class="fa-solid fa-volume-high me-1"></i> জরুরি ঘোষণা - নতুন অ্যাক্সেস ডোমেইন পাসওয়ার্ড পরিবর্তন করুন</span>
        <i class="fa-solid fa-download"></i>
    </div>

    <!-- Top Banner Slider (Using 1.png, 2.png, 3.png) -->
    <div class="banner-slider">
        <div id="topBannerCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="./1.png" class="d-block w-100" alt="Banner 1">
                </div>
                <div class="carousel-item">
                    <img src="./2.png" class="d-block w-100" alt="Banner 2">
                </div>
                <div class="carousel-item">
                    <img src="./3.png" class="d-block w-100" alt="Banner 3">
                </div>
            </div>
        </div>
    </div>

    <!-- Top Category Navigation -->
    <div class="cat-nav">
        <a href="#" class="cat-item active"><i class="fa-solid fa-house"></i>হোম</a>
        <a href="#" class="cat-item"><i class="fa-solid fa-fire text-danger"></i>গরম</a>
        <a href="#" class="cat-item"><i class="fa-solid fa-gamepad text-warning"></i> স্লট</a>
        <a href="#" class="cat-item"><i class="fa-solid fa-fish text-info"></i>ফির্শিং</a>
        <a href="#" class="cat-item"><i class="fa-solid fa-compass text-primary"></i>লাইভ</a>
    </div>

    <!-- Hot Games Section -->
    <div class="section-title">
        <i class="fa-solid fa-fire text-danger"></i> গরম খেলা
    </div>
    
    <div class="game-grid">
        <a href="#" class="game-card">
            <img src="./4.jpeg" alt="সুপার এস" onerror="this.src='./4.jpg'">
            <div class="game-title">সুপার এস</div>
        </a>
        <a href="#" class="game-card">
            <img src="./5.jpeg" alt="এভিয়েটর" onerror="this.src='./5.jpg'">
            <div class="game-title">এভিয়েটর</div>
        </a>
        <a href="#" class="game-card">
            <img src="./6.jpeg" alt="Fiery Seven" onerror="this.src='./6.jpg'">
            <div class="game-title">Fiery Seven</div>
        </a>
        <a href="#" class="game-card">
            <img src="./7.jpeg" alt="বক্সিং কিং" onerror="this.src='./7.jpg'">
            <div class="game-title">বক্সিং কিং</div>
        </a>
        <a href="#" class="game-card">
            <img src="./8.jpeg" alt="ফরচুন জেম্স ২" onerror="this.src='./8.jpg'">
            <div class="game-title">ফরচুন জেম্স ২</div>
        </a>
        <a href="#" class="game-card">
            <img src="./9.jpeg" alt="সুপার এস ডি..." onerror="this.src='./9.jpg'">
            <div class="game-title">সুপার এস ডি...</div>
        </a>
    </div>

    <!-- Floating Social Contact Links -->
    <div class="floating-socials">
        <a href="#" class="social-btn btn-cs"><i class="fa-solid fa-headset"></i></a>
        <a href="#" class="social-btn btn-tg"><i class="fa-brands fa-telegram"></i></a>
        <a href="#" class="social-btn btn-fb"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" class="social-btn btn-wa"><i class="fa-brands fa-whatsapp"></i></a>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="#" class="nav-link-custom active">
            <i class="fa-solid fa-house"></i>
            হোম
        </a>
        <a href="#" class="nav-link-custom">
            <i class="fa-solid fa-gift"></i>
            প্রমোশন
        </a>
        <a href="#" class="nav-link-custom">
            <div class="agent-btn"><i class="fa-solid fa-coins"></i></div>
            এজেন্ট
        </a>
        <a href="#" class="nav-link-custom">
            <i class="fa-solid fa-wallet"></i>
            ডিপোজিট
        </a>
        <a href="#" class="nav-link-custom">
            <i class="fa-solid fa-user"></i>
            অ্যাকাউন্ট
        </a>
    </div>

    <!-- Bootstrap JS for Slider -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
