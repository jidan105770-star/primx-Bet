<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primex-Bet</title>
  
  <!-- Font Awesome Icons & Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0d1e4a;
      --card-bg: #11285e;
      --top-banner: #ff3b30;
      --accent-yellow: #f1c40f;
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding-bottom: 70px;
      margin: 0;
    }

    /* Top App Download Bar */
    .top-app-bar {
      background-color: var(--top-banner);
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
    }
    
    .btn-download {
      background-color: #fffb00;
      color: #000;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px;
      font-weight: bold;
      border: none;
    }

    /* Main Header Nav */
    .header-nav {
      background-color: #091535;
      padding: 10px 12px;
      border-bottom: 1px solid #1c3573;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      font-style: italic;
    }

    .brand-logo span {
      color: #ffa500;
    }

    /* Banner Slider */
    .banner-container {
      margin: 10px 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #23428c;
    }

    .carousel-item img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    /* Top Category Icons */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0;
    }

    .cat-card {
      min-width: 65px;
      background: linear-gradient(180deg, #183375 0%, #0d1e4a 100%);
      border: 1px solid #284aa1;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      font-size: 11px;
    }

    .cat-card.active {
      background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
      color: #000;
      font-weight: bold;
      border: none;
    }

    .cat-card i {
      font-size: 18px;
      margin-bottom: 3px;
      display: block;
    }

    /* Section Title */
    .section-header {
      font-size: 14px;
      font-weight: bold;
      margin: 12px 0 8px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
    }

    /* 3-Column Mobile Game Grid */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .game-item {
      background-color: var(--card-bg);
      border-radius: 10px;
      border: 1px solid #203f8a;
      overflow: hidden;
      text-align: center;
      padding-bottom: 6px;
      position: relative;
    }

    .game-item img {
      width: 100%;
      height: 95px;
      object-fit: cover;
      border-radius: 8px 8px 0 0;
    }

    .game-name {
      font-size: 11px;
      margin-top: 5px;
      color: #d1d5db;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
    }

    /* Floating Social Bar */
    .floating-social {
      position: fixed;
      right: 8px;
      top: 45%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 99;
    }

    .social-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #0e204d;
      border: 1px solid #2f54b3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #07122b;
      display: flex;
      justify-content: space-around;
      padding: 6px 0;
      border-top: 1px solid #1a336d;
      z-index: 1000;
    }

    .nav-item-btn {
      text-align: center;
      color: #8b9bb4;
      font-size: 10px;
      text-decoration: none;
    }

    .nav-item-btn.active {
      color: #ffd700;
    }

    .nav-item-btn i {
      font-size: 16px;
      display: block;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Top App Download Notice Bar -->
  <div class="top-app-bar d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="fa-solid fa-mobile-screen"></i>
      <span>ডাউনলোড বোনাস ২৭ টাকা</span>
    </div>
    <button class="btn-download">ডাউনলোড করুন</button>
  </div>

  <!-- Header Section -->
  <div class="header-nav d-flex justify-content-between align-items-center">
    <div class="brand-logo">
      <i class="fa-solid fa-bars me-2 fs-6"></i>PRIMEX<span>-BET</span>
    </div>
    <div>
      <button class="btn btn-sm btn-outline-light me-1 px-3" style="font-size: 12px;">লগইন</button>
      <button class="btn btn-sm btn-warning fw-bold px-3" style="font-size: 12px;">নিবন্ধন</button>
    </div>
  </div>

  <div class="container-fluid px-2">

    <!-- 1. Banner Slider Section (Using Provided Links) -->
    <div class="banner-container">
      <div id="bannerCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://i.imgur.com/g1NxCLt.jpg" alt="Banner 1">
          </div>
          <div class="carousel-item">
            <img src="https://i.imgur.com/d4EbUDF.jpg" alt="Banner 2">
          </div>
          <div class="carousel-item">
            <img src="https://i.imgur.com/pkNhn02.jpg" alt="Banner 3">
          </div>
        </div>
      </div>
    </div>

    <!-- Category Menu Bar -->
    <div class="category-scroll">
      <div class="cat-card active">
        <i class="fa-solid fa-house"></i>হোম
      </div>
      <div class="cat-card">
        <i class="fa-solid fa-fire text-danger"></i>গরম
      </div>
      <div class="cat-card">
        <i class="fa-solid fa-gamepad text-warning"></i>স্লট
      </div>
      <div class="cat-card">
        <i class="fa-solid fa-fish text-info"></i>ফিশিং
      </div>
      <div class="cat-card">
        <i class="fa-solid fa-tower-broadcast text-success"></i>লাইভ
      </div>
    </div>

    <!-- Section Title -->
    <div class="section-header">
      <i class="fa-solid fa-fire text-danger"></i>
      <span>গরম খেলা</span>
    </div>

    <!-- 2. Games Grid Section (3 Columns - Same as Screenshot) -->
    <div class="game-grid">
      
      <!-- Aviator -->
      <div class="game-item">
        <img src="https://i.imgur.com/5i0dSOf.jpg" alt="Aviator">
        <div class="game-name">এভিয়েটর</div>
      </div>

      <!-- Super Ace -->
      <div class="game-item">
        <img src="https://i.imgur.com/4XipYZw.jpg" alt="Super Ace">
        <div class="game-name">সুপার এস</div>
      </div>

      <!-- Gems Fortune -->
      <div class="game-item">
        <img src="https://i.imgur.com/lIJA4HT.jpg" alt="Gems Fortune">
        <div class="game-name">ফরচুন জেমস</div>
      </div>

      <!-- Boxing King -->
      <div class="game-item">
        <img src="https://i.imgur.com/QwFe37H.jpg" alt="Boxing King">
        <div class="game-name">বক্সিং কিং</div>
      </div>

      <!-- Dice Game -->
      <div class="game-item">
        <img src="https://i.imgur.com/HItf4ip.jpg" alt="Dice Game">
        <div class="game-name">হট ডাইস</div>
      </div>

      <!-- Lucky Wheel Spin -->
      <div class="game-item">
        <img src="https://i.imgur.com/oOBYF2l.jpg" alt="Lucky Wheel">
        <div class="game-name">ল্যাকি স্পিন</div>
      </div>

    </div>

  </div>

  <!-- Floating Right Side Social Buttons -->
  <div class="floating-social">
    <div class="social-btn"><i class="fa-headset text-warning"></i></div>
    <div class="social-btn"><i class="fa-paper-plane text-info"></i></div>
    <div class="social-btn"><i class="fa-brands fa-facebook-f text-primary"></i></div>
    <div class="social-btn"><i class="fa-brands fa-whatsapp text-success"></i></div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav">
    <a href="#" class="nav-item-btn active">
      <i class="fa-solid fa-house"></i>
      <span>হোম</span>
    </a>
    <a href="#" class="nav-item-btn">
      <i class="fa-solid fa-gift"></i>
      <span>প্রমোশন</span>
    </a>
    <a href="#" class="nav-item-btn">
      <i class="fa-solid fa-user-tie"></i>
      <span>এজেন্ট</span>
    </a>
    <a href="#" class="nav-item-btn">
      <i class="fa-solid fa-wallet"></i>
      <span>ডিপোজিট</span>
    </a>
    <a href="#" class="nav-item-btn">
      <i class="fa-solid fa-user"></i>
      <span>একাউন্ট</span>
    </a>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
